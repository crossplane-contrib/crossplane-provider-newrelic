apiVersion: service.newrelic.upbound.io/v1alpha1
kind: Level
metadata:
  annotations:
    meta.upbound.io/example-id: service/v1alpha1/level
  labels:
    testing.upbound.io/example-name: level
  name: level
spec:
  forProvider:
    guid: MXxBUE18QVBQTElDQVRJT058MQ
    name: Latency
    description: Proportion of requests that are served faster than a threshold.
    events:
    - accountId: 12345678
      validEvents:
      - from: Transaction
        where: appName = 'Example application' AND (transactionType = 'Web')
      goodEvents:
      - from: Transaction
        where: appName = 'Example application' AND (transactionType = 'Web') AND duration < 0.1
    objective:
    - target: 99
      timeWindow:
      - rolling:
        - count: 7
          unit: DAY
